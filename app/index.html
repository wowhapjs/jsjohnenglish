<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주원 영어학습</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f4f7fb;color:#162033}header{padding:48px 8%;background:#19376d;color:#fff}main{max-width:1000px;margin:auto;padding:34px 7%}.hero,.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 6px 24px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:20px}.badge{display:inline-block;background:#e8f1ff;color:#19376d;padding:6px 12px;border-radius:99px;font-weight:700}.word{font-size:28px;font-weight:800}.en{color:#2b61b2}button{border:0;border-radius:10px;padding:10px 15px;background:#19376d;color:white;cursor:pointer}footer{text-align:center;color:#6b7280;padding:30px}</style></head><body><header><span class="badge">JUWON ENGLISH</span><h1>주원 영어학습</h1><p>매일 조금씩, 듣고 말하고 읽고 쓰는 영어 공부</p></header><main><section class="hero"><h2>오늘의 영어</h2><p class="word en">I can do it!</p><p>나는 할 수 있어!</p><button onclick="speechSynthesis.speak(new SpeechSynthesisUtterance('I can do it!'))">발음 듣기</button></section><section class="grid"><article class="card"><h2>단어 공부</h2><p><b>happy</b> 행복한 · <b>learn</b> 배우다 · <b>friend</b> 친구</p></article><article class="card"><h2>문장 연습</h2><p>My name is Juwon.<br>I study English every day.</p></article><article class="card"><h2>오늘의 미션</h2><p>영어 단어 5개 읽기<br>문장 3번 소리 내어 말하기</p></article></section></main><footer>주원 영어학습 · English Learning</footer></body></html>
